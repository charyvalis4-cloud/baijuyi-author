<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); }

  .ebook-wrap {
    max-width: 660px;
    margin: 0 auto;
    padding: 1rem 0 2rem;
  }

  .page { display: none; flex-direction: column; align-items: center; gap: 14px; }
  .page.active { display: flex; }

  .page-header {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px;
    background: var(--color-background-secondary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-md);
  }
  .page-num { font-size: 13px; color: var(--color-text-secondary); }
  .page-title-text { font-size: 15px; font-weight: 500; color: var(--color-text-primary); }

  .comic-frame {
    width: 100%;
    border: 2px solid var(--color-text-primary);
    border-radius: var(--border-radius-md);
    overflow: hidden;
    background: #fff;
  }
  .comic-frame svg { display: block; width: 100%; height: auto; }

  .play-all-btn {
    width: 100%;
    padding: 9px 16px;
    font-size: 14px; font-weight: 500;
    border-radius: var(--border-radius-md);
    border: 0.5px solid var(--color-border-secondary);
    background: var(--color-background-secondary);
    color: var(--color-text-primary);
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
  }
  .play-all-btn:hover { background: var(--color-background-tertiary); }

  .speech-grid {
    width: 100%;
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .speech-btn {
    padding: 10px 12px;
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-md);
    background: var(--color-background-primary);
    cursor: pointer;
    text-align: left;
    transition: background 0.15s;
    display: flex; flex-direction: column; gap: 3px;
  }
  .speech-btn:hover { background: var(--color-background-secondary); }
  .speech-btn.playing { border-color: #1D9E75; background: #E1F5EE; }
  .speech-btn .cell-label {
    font-size: 11px; color: var(--color-text-tertiary);
    display: flex; align-items: center; gap: 4px;
  }
  .speech-btn .cell-text {
    font-size: 13px; color: var(--color-text-primary); line-height: 1.5;
  }
  .speech-btn.playing .cell-label { color: #0F6E56; }

  .nav-row {
    width: 100%;
    display: flex; justify-content: space-between; gap: 12px;
    margin-top: 4px;
  }
  .nav-btn {
    flex: 1; padding: 10px 16px;
    font-size: 14px; font-weight: 500;
    border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md);
    background: var(--color-background-primary);
    color: var(--color-text-primary);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .nav-btn:hover:not(:disabled) { background: var(--color-background-secondary); }
  .nav-btn:disabled { color: var(--color-text-tertiary); cursor: not-allowed; }

  .dot-row {
    display: flex; gap: 8px; justify-content: center;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--color-border-secondary);
    transition: background 0.2s;
  }
  .dot.active { background: var(--color-text-primary); }
</style>

<script>/* 只用臺灣華語（zh-TW）語音，絕不退回大陸（zh-CN）或粵語（zh-HK）語音 */
function twVoice(){var L=[];try{L=speechSynthesis.getVoices()}catch(e){}
var tw=L.filter(function(v){var l=(v.lang||'').replace('_','-').toLowerCase();return l==='zh-tw'||l==='cmn-tw'||l.indexOf('zh-hant-tw')===0||(/^(zh|cmn)/.test(l)&&/taiwan|臺灣|台灣/i.test(v.name))});
tw.sort(function(a,b){return (/natural|online|premium|enhanced/i.test(b.name)?1:0)-(/natural|online|premium|enhanced/i.test(a.name)?1:0)});return tw[0]||null}
function twApply(u){u.lang='zh-TW';var v=twVoice();if(v)u.voice=v;return u}
try{speechSynthesis.getVoices();speechSynthesis.addEventListener('voiceschanged',function(){})}catch(e){}
</script>
<script>
let curPage = 1;
let curBtnId = null;

function goPage(n) {
  stopSpeech();
  document.getElementById('p' + curPage).classList.remove('active');
  document.getElementById('dot' + curPage).classList.remove('active');
  curPage = n;
  document.getElementById('p' + n).classList.add('active');
  document.getElementById('dot' + n).classList.add('active');
  window.scrollTo(0,0);
}

function toggleSpeech(btnId, text) {
  const btn = document.getElementById(btnId);
  if (curBtnId === btnId && speechSynthesis.speaking) { stopSpeech(); return; }
  stopSpeech();
  const u = new SpeechSynthesisUtterance(text);
  twApply(u); u.rate = 0.92;
  u.onend = () => resetBtn(btnId);
  u.onerror = () => resetBtn(btnId);
  curBtnId = btnId;
  btn.classList.add('playing');
  btn.querySelector('.cell-label').innerHTML = '<i class="ti ti-player-pause" aria-hidden="true"></i>播放中';
  speechSynthesis.speak(u);
}

function stopSpeech() {
  speechSynthesis.cancel();
  if (curBtnId) resetBtn(curBtnId);
  curBtnId = null;
}

function resetBtn(id) {
  const btn = document.getElementById(id);
  if (!btn) return;
  btn.classList.remove('playing');
  const lbl = btn.querySelector('.cell-label');
  const g = btn.id.replace('p','').replace(/g.*/,'');
  const c = btn.id.replace(/p\dg/,'');
  lbl.innerHTML = '<i class="ti ti-speakerphone" aria-hidden="true"></i>格 ' + c;
}

const allTexts = {
  1: ['白居易說：妳好，我叫樂天！','白母說：休想！她一個村姑，配不上我兒！','白居易說：我中了！這次娶湘靈，名正言順了！','湘靈哭著說：居易哥哥，你說過要娶我的啊！'],
  2: ['旁白：白居易三十七歲終於娶妻，但家裡另有安排……','白居易說：櫻桃樊素口，楊柳小蠻腰～','白居易詩云：十載春啼變鶯舌，三嫌老醜換蛾眉。三年一換，自炫中！','白居易哭著說：明日放歸後，世間應不要春風。'],
  3: ['關盼盼說：夫君已逝，我守節十年，此志不渝！','白居易寫詩暗示說：妳何不索性以死殉夫呢？','旁白：關盼盼絕食十天，含冤而亡。','後世網友一致認定：渣男本渣！但長恨歌還是要背……']
};

async function playAll(p) {
  stopSpeech();
  for (let t of allTexts[p]) {
    await new Promise(res => {
      const u = new SpeechSynthesisUtterance(t);
      twApply(u); u.rate = 0.92;
      u.onend = () => setTimeout(res, 500);
      u.onerror = res;
      speechSynthesis.speak(u);
    });
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && curPage < 3) goPage(curPage + 1);
  if (e.key === 'ArrowLeft' && curPage > 1) goPage(curPage - 1);
});
